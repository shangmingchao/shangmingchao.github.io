        * {

            padding: 0;
            box-sizing: border-box;

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            line-height: 1.6;
            background-color: #ffffff;
            color: #333333;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #1a1a1a;
        }

        section {
            margin-bottom: 40px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
            border-left: 4px solid #3498db;
            padding-left: 12px;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 12px;
        }

        a {
            color: #3498db;
            text-decoration: none;
            transition: color 0.2s, opacity 0.2s;
            font-size: 1rem;
        }

        a:hover {
            color: #2980b9;
            opacity: 0.8;
        }

        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #777777;
            font-size: 0.9rem;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #e0e0e0;
            }

            h1 {
                color: #f0f0f0;
            }

            h2 {
                color: #b0b0b0;
                border-left-color: #5dade2;
            }

            a {
                color: #5dade2;
            }

            a:hover {
                color: #85c1e9;
            }

            header {
                border-bottom-color: #333333;
            }

            footer {
                border-top-color: #333333;
                color: #888888;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            h1 {
                font-size: 1.75rem;
            }

            h2 {
                font-size: 1.3rem;
            }

            a {
                font-size: 0.95rem;
            }
        }
    </style>
